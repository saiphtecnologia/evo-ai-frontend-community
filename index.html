<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Modified by SAIPH: branded metadata and pre-paint theme bootstrap. -->
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SAIPH Flow</title>
    <script>
      (() => {
        const root = document.documentElement;
        let preference = 'dark';
        try {
          const saved = localStorage.getItem('saiph.theme');
          const legacy = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light' || saved === 'system') {
            preference = saved;
          } else if (legacy === 'dark' || legacy === 'light') {
            preference = legacy;
            localStorage.setItem('saiph.theme', legacy);
          }
        } catch (_) {
          preference = 'dark';
        }
        const resolved = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        root.dataset.theme = resolved;
        root.classList.toggle('dark', resolved === 'dark');
        root.style.colorScheme = resolved;
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', resolved === 'dark' ? '#000000' : '#FFFFFF');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
